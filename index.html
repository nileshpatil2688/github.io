<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheOpenHood — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,100,0,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,100,0,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    canvas#sparks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .page {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .orbit-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }
    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .orbit-ring:nth-child(1) { width: 340px; height: 340px; border: 1px solid rgba(255,100,0,0.13); animation: orbitRing 8s linear infinite; }
    .orbit-ring:nth-child(2) { width: 500px; height: 500px; border: 1px solid rgba(255,150,0,0.08); animation: orbitRing 14s linear infinite reverse; }
    .orbit-ring:nth-child(3) { width: 700px; height: 700px; border: 1px solid rgba(255,80,0,0.05); animation: orbitRing 20s linear infinite; }
    .dot-orbit {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff6600;
      top: -4px; left: calc(50% - 4px);
      box-shadow: 0 0 10px #ff6600, 0 0 20px #ff4400;
    }

    .car-stage {
      width: min(600px, 92vw);
      margin-bottom: 18px;
    }
    .car-img {
      width: 100%;
      display: block;
      filter: contrast(1.25) brightness(0.88) saturate(0.7) drop-shadow(0 0 18px rgba(255,100,0,0.25));
      mix-blend-mode: lighten;
    }

    .coming-badge {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 7px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(30px, 8vw, 56px);
      font-weight: 900;
      color: #ff6600;
      letter-spacing: 3px;
      animation: flashTitle 1.8s ease-in-out infinite;
      line-height: 1;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #ff9944;
      letter-spacing: 5px;
      text-transform: uppercase;
      animation: subtitlePulse 2.2s ease-in-out infinite;
      margin-bottom: 32px;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(to right, transparent, #ff6600, transparent);
      margin: 0 auto 24px;
    }

    .tagline {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 400;
      color: #cccccc;
      line-height: 1.7;
      animation: taglineFade 3s ease-in-out infinite;
      max-width: 420px;
      margin-bottom: 30px;
    }
    .tagline span { color: #ff6600; font-weight: 600; }

    .flame-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      height: 40px;
      margin-bottom: 30px;
    }
    .flame {
      width: 7px;
      border-radius: 50% 50% 20% 20%;
      background: linear-gradient(to top, #ff2200, #ff9900, #ffee00);
    }
    .flame:nth-child(1) { height: 26px; animation: flamePulse 0.55s ease-in-out infinite 0s; }
    .flame:nth-child(2) { height: 34px; animation: flamePulse 0.55s ease-in-out infinite 0.12s; }
    .flame:nth-child(3) { height: 22px; animation: flamePulse 0.55s ease-in-out infinite 0.24s; }
    .flame:nth-child(4) { height: 30px; animation: flamePulse 0.55s ease-in-out infinite 0.08s; }
    .flame:nth-child(5) { height: 20px; animation: flamePulse 0.55s ease-in-out infinite 0.18s; }
    .flame:nth-child(6) { height: 28px; animation: flamePulse 0.55s ease-in-out infinite 0.3s; }
    .flame:nth-child(7) { height: 16px; animation: flamePulse 0.55s ease-in-out infinite 0.05s; }

    .notify-form {
      display: flex;
      gap: 0;
      border: 1px solid rgba(255,102,0,0.35);
      border-radius: 6px;
      overflow: hidden;
      max-width: 380px;
      width: 100%;
    }
    .notify-form input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: none;
      padding: 12px 16px;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .notify-form input::placeholder { color: #555; }
    .notify-form button {
      background: #ff6600;
      border: none;
      padding: 12px 22px;
      color: #000;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .notify-form button:hover { background: #ff8800; }

    .footer-line {
      margin-top: 36px;
      font-size: 12px;
      color: #333;
      letter-spacing: 2px;
    }

    
      100% { transform: perspective(700px) rotateY(360deg); }
    }
    
      50%,88% { transform: perspective(500px) rotateX(-40deg); }
      100%    { transform: perspective(500px) rotateX(0deg); }
    }
    
      52%,86% { opacity: 1; }
      96%,100%{ opacity: 0; }
    }
    @keyframes flashTitle {
      0%,100% { text-shadow: 0 0 20px #ff6600, 0 0 50px #ff4400; opacity: 1; }
      50%     { text-shadow: 0 0 60px #ff9900, 0 0 120px #ff4400; opacity: 0.65; }
    }
    @keyframes subtitlePulse {
      0%,100% { opacity: 0.7; letter-spacing: 5px; }
      50%     { opacity: 1; letter-spacing: 7px; }
    }
    @keyframes taglineFade {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.65; }
    }
    @keyframes orbitRing {
      0%   { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes flamePulse {
      0%,100% { transform: scaleY(1); opacity: 0.9; }
      50%     { transform: scaleY(1.35); opacity: 1; }
    }
    
      10%  { opacity: 0.5; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(190px); opacity: 0; }
    }
  </style>
</head>

      <button type="submit">Notify Me</button>
    </form>

    <p class="footer-line">&copy; 2026 TheOpenHood &mdash; All rights reserved</p>
  </div>

  <script>
    const canvas = document.getElementById('sparks');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = Array.from({length: 70}, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -Math.random() * 1.0 - 0.2,
      size: Math.random() * 2.2 + 0.4,
      life: Math.random(),
      maxLife: 0.5 + Math.random() * 0.5,
      color: Math.random() > 0.5 ? '#ff6600' : '#ff9900'
    }));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.004;
        if (p.life <= 0) {
          p.x = Math.random() * canvas.width;
          p.y = canvas.height * 0.6 + Math.random() * 100;
          p.life = p.maxLife;
          p.vx = (Math.random() - 0.5) * 0.5;
          p.vy = -Math.random() * 1.0 - 0.2;
        }
        ctx.globalAlpha = (p.life / p.maxLife) * 0.75;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();

    function handleNotify(e) {
      e.preventDefault();
      const el = document.getElementById('email-in');
      if (el.value) {
        el.value = '';
        el.placeholder = "You're on the list! We'll be in touch.";
      }
    }
  </script>
</body>
</html>
